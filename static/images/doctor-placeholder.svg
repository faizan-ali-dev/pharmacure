<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="doctorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
        </linearGradient>
        <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" stroke="#cbd5e1" stroke-width="1" rx="20"/>
    
    <!-- Subtle pattern -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" rx="20"/>
    
    <!-- Doctor figure -->
    <g transform="translate(150,150)">
        <!-- Head -->
        <circle cx="0" cy="-40" r="35" fill="url(#doctorGradient)" opacity="0.7"/>
        
        <!-- Body -->
        <rect x="-25" y="-10" width="50" height="70" rx="10" fill="url(#doctorGradient)" opacity="0.7"/>
        
        <!-- White coat -->
        <rect x="-30" y="-5" width="60" height="75" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>
        
        <!-- Stethoscope -->
        <circle cx="-15" cy="5" r="3" fill="none" stroke="#374151" stroke-width="2"/>
        <circle cx="15" cy="5" r="3" fill="none" stroke="#374151" stroke-width="2"/>
        <path d="M -15 5 Q 0 -5 15 5" fill="none" stroke="#374151" stroke-width="2"/>
        <path d="M 0 -5 L 0 15" stroke="#374151" stroke-width="2"/>
        <circle cx="0" cy="15" r="4" fill="none" stroke="#374151" stroke-width="2"/>
        
        <!-- Pocket -->
        <rect x="-20" y="10" width="15" height="20" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>
        
        <!-- Pens in pocket -->
        <rect x="-18" y="12" width="2" height="15" rx="1" fill="#3b82f6"/>
        <rect x="-15" y="12" width="2" height="12" rx="1" fill="#ef4444"/>
        <rect x="-12" y="12" width="2" height="10" rx="1" fill="#10b981"/>
    </g>
    
    <!-- Medical cross top corners -->
    <g transform="translate(50,50)">
        <rect x="-2" y="-8" width="4" height="16" fill="url(#crossGradient)" rx="2"/>
        <rect x="-8" y="-2" width="16" height="4" fill="url(#crossGradient)" rx="2"/>
    </g>
    
    <g transform="translate(250,50)">
        <rect x="-2" y="-8" width="4" height="16" fill="url(#crossGradient)" rx="2"/>
        <rect x="-8" y="-2" width="16" height="4" fill="url(#crossGradient)" rx="2"/>
    </g>
    
    <!-- Medical icons -->
    <g transform="translate(60,220)">
        <!-- Heart -->
        <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" 
              fill="#ef4444" opacity="0.6" transform="scale(0.8)"/>
    </g>
    
    <g transform="translate(220,220)">
        <!-- Pills -->
        <circle cx="5" cy="5" r="4" fill="#3b82f6" opacity="0.6"/>
        <circle cx="15" cy="5" r="4" fill="#10b981" opacity="0.6"/>
        <ellipse cx="10" cy="15" rx="6" ry="3" fill="#f59e0b" opacity="0.6"/>
    </g>
    
    <!-- Text -->
    <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">
        No Photo Available
    </text>
    
    <!-- Subtitle -->
    <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
        Doctor Profile Picture
    </text>
</svg>