<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg)" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <!-- Medicine bottle icon -->
    <g transform="translate(150,100)">
        <!-- Bottle body -->
        <rect x="-25" y="-10" width="50" height="60" rx="8" fill="#6c757d" opacity="0.3"/>
        
        <!-- Bottle cap -->
        <rect x="-20" y="-25" width="40" height="15" rx="3" fill="#6c757d" opacity="0.4"/>
        
        <!-- Label -->
        <rect x="-18" y="0" width="36" height="20" rx="2" fill="#ffffff" opacity="0.8"/>
        
        <!-- Plus symbol -->
        <rect x="-2" y="5" width="4" height="10" fill="#28a745"/>
        <rect x="-7" y="8" width="14" height="4" fill="#28a745"/>
    </g>
    
    <!-- Text -->
    <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">
        No Image Available
    </text>
    
    <!-- Pharmacy cross -->
    <g transform="translate(50,50)">
        <rect x="-2" y="-8" width="4" height="16" fill="#dc3545" opacity="0.6"/>
        <rect x="-8" y="-2" width="16" height="4" fill="#dc3545" opacity="0.6"/>
    </g>
    
    <g transform="translate(250,50)">
        <rect x="-2" y="-8" width="4" height="16" fill="#dc3545" opacity="0.6"/>
        <rect x="-8" y="-2" width="16" height="4" fill="#dc3545" opacity="0.6"/>
    </g>
</svg>